services:
  nginx:
    image: nginx:alpine
    container_name: nginx-https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  letsencrypt:
    external: true   # certbot 실행 시 만들어지는 볼륨(인증서 보관)
