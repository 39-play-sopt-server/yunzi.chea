name: Auto Request Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  request-review:
    # 브랜치 이름이 feat 로 시작하는 PR 에서만 실행
    if: startsWith(github.head_ref, 'feat')
    runs-on: ubuntu-latest
    steps:
      - name: Request reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWERS: Kyoung-M1N sssthnnhee leseok mindolii KateteDeveloper
        run: |
          for reviewer in $REVIEWERS; do
            # PR 작성자 본인은 리뷰어로 지정할 수 없으므로 건너뜀
            if [ "${reviewer,,}" = "${AUTHOR,,}" ]; then
              echo "Skip author: $reviewer"
              continue
            fi
            # 한 명이 실패(협업자 아님 등)해도 나머지는 계속 요청
            gh api "repos/$GH_REPO/pulls/$NUMBER/requested_reviewers" \
              -f "reviewers[]=$reviewer" \
              || echo "Failed to request review from $reviewer"
          done
