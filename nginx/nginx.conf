# HTTP(80) -> HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name dev.yunji-dev.store;

    return 301 https://$host$request_uri;
}

# HTTPS(443) -> 스프링(8080) 리버스 프록시
server {
    listen 443 ssl;
    server_name dev.yunji-dev.store;

    ssl_certificate     /etc/letsencrypt/live/dev.yunji-dev.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.yunji-dev.store/privkey.pem;

    location / {
        # 컨테이너 안에서 호스트(내 PC)의 스프링을 가리키는 주소
        proxy_pass http://host.docker.internal:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
